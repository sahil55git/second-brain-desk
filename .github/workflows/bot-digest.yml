# Every evening: ask the site to send the 9 pm summary to the owner's linked Telegram / Discord.
# The site sends it at most once a day and only after 8 pm India time (app/api/bot/cron).
# Optional: set CRON_SECRET as a repository secret and as a Vercel env variable to lock the call.
name: bot-digest
on:
  schedule:
    - cron: "35 15 * * *" # 21:05 IST: the day's summary (GitHub may start it a little late)
    - cron: "5 2 * * *" # 07:35 IST: each person's tasks for the day
  workflow_dispatch:
permissions: {}
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send the summary
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -n "$CRON_SECRET" ]; then AUTH="Authorization: Bearer $CRON_SECRET"; else AUTH="X-No-Secret: 1"; fi
          curl -sS --max-time 90 -H "$AUTH" https://mahadev-second-brain.vercel.app/api/bot/cron
