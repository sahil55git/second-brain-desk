name: Counter layout validation

on:
  push:
    branches: [codex/tablet-counter-readability]
    paths: [.github/workflows/counter-layout-validation.yml]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run prisma:generate
      - run: npx tsc --noEmit
