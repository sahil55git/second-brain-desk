<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

button{font-family:inherit;font-size:inherit;color:inherit;touch-action:manipulation;cursor:pointer}

.next{position:relative;outline:3px solid var(--gold);outline-offset:3px;animation:nxGlow 1.3s ease-in-out infinite;z-index:1}
.next::after{content:"";position:absolute;top:50%;right:14px;width:34px;height:34px;transform:translateY(-10%);background:no-repeat center/contain url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M9 11V5.5a1.6 1.6 0 013.2 0V10l4 .8a2 2 0 011.6 2L17.5 19a2 2 0 01-2 1.7H11a2 2 0 01-1.6-.8L5.7 14.6a1.5 1.5 0 012.2-2L9 13.6z' fill='white' stroke='%23222' stroke-width='.9'/></svg>");animation:nxPoint .9s ease-in-out infinite;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}

.sbtn.go.next{background-image:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);background-size:60% 100%;background-repeat:no-repeat;animation:nxGlow 1.3s ease-in-out infinite,nxSheen 2.2s linear infinite}
@keyframes nxGlow{0%,100%{outline-color:rgba(217,160,50,.45)}50%{outline-color:#FFC857}}

@keyframes nxSheen{0%{background-position:-120% 0}100%{background-position:220% 0}}

 if(!demo.dataset.ready){demo.dataset.ready=1;demo.insertAdjacentHTML('beforeend',[['Seed bag 48.6',48.6],['Full barrel 192.4',192.4],['Empty barrel 12.3',12.3],['Next bag 49.2',49.2],['Can + oil 19.85',19.85],['Khali bag 44.3',44.3],['Moving…',130],['Over 300',312],['Empty',0]].map(([l,v])=>`<button onclick="simSet(${v})">${l}</button>`).join(''))}
 $('#top').innerHTML=`<h1><span class="tt">${ic('weigh')}Mill Desk</span><small><b style="color:var(--amber,#E9C46A)">${nowShort()}</b></small></h1>
  <span class="pill" data-f="bt" title="Bluetooth scale" onclick="millScaleTap()"><span class="dot"></span>${ic('bt')}</span><span class="pill" data-f="pr" title="Printer" onclick="millPrinterTap()"><span class="dot"></span>${ic('printer')}</span>
  <button class="pill" data-f="lang" onclick="S.lang=S.lang==='en'?'kn':'en';render()"><span class="gl">${ic('globe')}</span>${S.lang==='en'?'EN':'ಕನ್ನಡ'}</button>
  ${S.mode==='worker'?'':`<button class="pill" onclick="sheetSettings()" aria-label="Settings">${ic('gear')}</button>`}${S.mode==='worker'?'':`<button class="pill" onclick="millCounterOpen()" aria-label="Barrel counter desk">${icoSvg('bfull',22)}</button>`}<button class="pill on" data-f="mode" onclick="S.mode=S.mode==='worker'?'counter':'worker';S.view='pick';render()">${ic(S.mode==='worker'?'user':'rupee')}<span class="pl">${S.mode==='worker'?'Worker':'Counter'}</span><span class="pl">⇄</span></button>`;
 const cnt=(n,ico,key,fn,hl)=>`<button class="cp ${hl?'has':''}" data-f="tab-${key}" onclick="${fn}">${ico==='jc'?jcIcon(24):ico==='own'?ownIcon(24):ic(ico)}<span>${t(key)}</span><span class="n">${n}</span></button>`;
 $('#chips').innerHTML=cnt(S.queue.length,'hourg','waiting','sheetWaiting()',S.queue.length)+cnt(openCount()+held().length,'jc','jobs','sheetJobs()',0)+cnt(held().length,'lock','held','sheetHeld()',held().length)+cnt(runsActive(),'own','mill','sheetMill()',runsActive())+cnt(S.parked.length,'park','parked','sheetParked()',S.parked.length);

}
const weightCard=()=>`<div class="wrow"><div class="wcard"><div class="lbl"><span>WEIGHT (KG)</span><span>300 kg × 50 g</span></div><div class="wnum" id="wnum">0.000</div><div class="wstat" id="wstat"></div></div>
 <button class="rbtn" id="rbtn" onclick="readNow()">${ic('book')}<span>${t('read')}</span></button></div>`;
function readNow(){if(!ready())return toast('Wait until the weight is steady','bad')}
function ownLine(){const o=S.own;return `<div class="own" data-f="own"><span>${ownIcon(24)} Ours today · seed <b>${f1(sum(o.oseed))} kg</b></span><span>oil <b>${f1(sum(o.ooil.map(x=>x[0])))} kg</b> <i class="cn">(${o.ooil.length} cans)</i></span><span>khali <b>${f1(sum(o.okhali))} kg</b> <i class="cn">(${o.okhali.length} bags)</i></span>${S.khali&&S.khali.bags?`<span title="All khali bags weighed minus khali sold">stack <b>${f1(S.khali.stackKg)} kg</b></span>`:''}${o.sed.length?`<span>sediment <b>${f1(sum(o.sed))} kg</b></span>`:''}</div>`}

 const badge=bk==='P'?`<i class="bdg" style="background:#5F82D4">${ic('user')}</i>`:bk==='F'?`<i class="bdg" style="background:#C98A25">${ic('mill')}</i>`:bk==='in'?`<i class="bdg in">${ic('down')}</i>`:bk==='out'?`<i class="bdg out">${ic('up')}</i>`:bk==='new'?`<i class="bdg" style="background:#3F9D63">${ic('spark')}</i>`:bk==='old'?`<i class="bdg" style="background:#C98A25">${ic('clock')}</i>`:'';

function groupsHTML(list,wk){return GROUPS.map(g=>{if(wk&&g.id==='cans')return '';const its=list.filter(i=>i.g===g.id);if(!its.length)return '';return `<div data-f="g-${g.id}"><div class="grp"><span class="gi" style="background:${g.c}">${ic(g.icon)}</span>${S.lang==='kn'?g.kn:g.en}</div><div class="grid">${its.map(i=>tileBtn(i,wk)).join('')}</div></div>`}).join('')}
function pickHTML(){
 const q=S.q.trim().toLowerCase(),list=ITEMS.filter(i=>!q||String(i.n)===q||i.wl.toLowerCase().includes(q)||i.en.toLowerCase().includes(q)||i.kn.includes(q));
 return weightCard()+ownLine()+`<div class="pane"><label class="search" data-f="search">${ic('search')}<input id="q" placeholder="${t('search')}" value="${esc(S.q)}" oninput="S.q=this.value;render();const e=$('#q');e.focus();e.setSelectionRange(99,99)">${micBtn('q','text')}</label>${groupsHTML(list,false)}</div>`}
const isCust=k=>k==='cseed'||k==='ckhali';
function trayAdd(k,kg){S.wtray.push({k,kg,nb:1,cno:isCust(k)?S.lastCno:0});S.wdone=null;afterSave()}
function traySum(){const g={};S.wtray.filter(x=>x.k==='cseed').forEach(x=>{(g[x.cno]=g[x.cno]||{n:0,kg:0});g[x.cno].n+=x.nb||1;g[x.cno].kg+=x.kg});const e=Object.entries(g);return e.length?`<div class="wsum">${e.map(([c,v])=>`<span class="pc tk">${ic('user')}${cnoL()} ${c} · ${bagTxt(v.n)} · ${f1(v.kg)} kg</span>`).join('')}</div>`:''}
function trayNb(i,d){S.wtray[i].nb=Math.max(1,(S.wtray[i].nb||1)+d);render()}
function trayLabel(i){const x=S.wtray[i],before=S.wtray.slice(0,i).filter(y=>y.k===x.k&&y.cno===x.cno),a=sum(before.map(y=>y.nb||1))+1,n=x.nb||1;return n===1?'Bag '+a:'Bags '+a+'–'+(a+n-1)}

function workerHTML(){
 const tr=S.wtray,tray=tr.length?`<div class="tray"><div class="th">${ic('printer')}<span>To save · ${tr.length}</span><button class="xbtn" onclick="S.wtray=[];render()">${ic('x')}</button></div>${traySum()}
  ${tr.map((x,i)=>`<div class="tl1">${art(IT[x.k])}<b>${esc(IT[x.k].wl)}</b><span class="kgbox">${f2(x.kg)} kg</span><button class="xbtn" onclick="S.wtray.splice(${i},1);render()">${ic('x')}</button></div>${isBagK(x.k)?`<div class="nbrow"><b>${trayLabel(i)}</b><span class="stpr"><button onclick="trayNb(${i},-1)">−</button><b>${x.nb||1}</b><button onclick="trayNb(${i},1)">+</button></span></div>`:''}${isCust(x.k)?`<div class="bagrow"><span>${cnoL()}</span>${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="${x.cno===n?'sel':''}" onclick="setCno(${i},${n})">${n}</button>`).join('')}</div>`:''}`).join('')}
  <button class="sbtn go next" style="min-height:74px;font-size:24px" onclick="workerPrint()"><span style="display:flex;gap:6px">${ic('printer')}${ic('check')}</span>Save &amp; Print</button></div>`:'';
 return weightCard()+tray+(S.wdone?`<div class="wdone">${ic('check')}<div><b>${esc(S.wdone.sn)}</b><div class="note">${S.wdone.n} weighing(s) saved and printed · counter will see them in Waiting</div></div></div>`:'')
  +(S.needZero?`<div class="takeoff">Take it off the scale</div>`:'')
  +`<div class="pane wk">${groupsHTML(ITEMS,true)}</div><div class="note">Worker: put it on the scale, wait for green, tap the picture. Tap more items if needed, then <b>Save &amp; Print</b>. Green ↓ comes in, red ↑ goes out.</div>`}
function workerPrint(){const tr=S.wtray;if(!tr.length)return;const sn='WS-'+pad(S.wsn++),tm=clock();
 tr.forEach(x=>S.queue.push({id:uid('Q'),k:x.k,nb:x.nb||1,kg:x.kg,time:tm,by:(S.me&&S.me.name)||'Worker',cno:x.cno||0,slip:sn}));
 S.wtray=[];S.wdone={sn,n:tr.length};millPrintAuto({kind:'slip',code:sn,shop:'MAHADEV TRADERS',title:'Mill 1 · WEIGHT SLIP',when:nowFull(),rows:tr.map(x=>[IT[x.k].wl+(x.cno?' · '+cnoL()+' '+x.cno:'')+(isBagK(x.k)?' · '+bagTxt(x.nb||1):''),f2(x.kg)+' kg']),foot:['By '+((S.me&&S.me.name)||'Worker'),nowFull()]},1);
 layer('Printed',`<div class="note">Saved · the counter person sees these in Waiting.</div><div id="prst" class="prst"></div>
  <div class="paper"><div class="hd">MAHADEV TRADERS</div><div style="text-align:center">Mill 1 · WEIGHT SLIP</div><div style="text-align:center;font-weight:700">${nowFull()}</div><div class="hr"></div>
  ${tr.map(x=>`<div class="sr"><span>${esc(IT[x.k].wl)}${x.cno?' · '+cnoL()+' '+x.cno:''}${isBagK(x.k)?' · '+bagTxt(x.nb||1):''}</span><b>${f2(x.kg)} kg</b></div>`).join('')}<div class="hr"></div>
  <div class="sr"><span>By ${esc((S.me&&S.me.name)||'Worker')}</span><span>${nowFull()}</span></div><div class="bcw">${bcSvg(sn)}</div><div style="text-align:center;font-size:12px;letter-spacing:.1em">${sn}</div></div>
  <button class="sbtn go next" onclick="window.__copies=1;printAgain()">${ic('printer')}<span class="prlbl">Print</span></button><button class="sbtn" onclick="millSticker()">${ic('printer')}Sticker</button><button class="sbtn" onclick="closeLayer()">${ic('check')}${t('done')}</button>`)}
const slipEst=()=>{const sp=S.slip;return settlement({seedKg:sum(sp.lines),cake:sp.cake,advC:sp.advC,advA:sp.advA,cans:sp.cans})};
function slipAmt(){return slipEst().due}
const CANK=[['can15','tin15','15 kg tin'],['can5new','j_new','5 kg new'],['can5old','j_old','5 kg old']];
function slipCan(k,d){S.slip.cans[k]=Math.max(0,(S.slip.cans[k]||0)+d);render()}
function slipHTML(){const sp=S.slip,kg=sum(sp.lines);
 const nbs=slipNbs(),needCust=!sp.cust,est=slipEst();
 return weightCard()+`<div class="pane slip">
  <button class="dash" onclick="S.view='pick';render()">${ic('plus')}${t('add')}</button>
  <button class="sbtn ${needCust?'next':''}" style="justify-content:flex-start;font-size:20px;min-height:64px" onclick="sheetCust()">${ic('user')}<span>${sp.cust?`<b>${esc(sp.cust[0])}</b>${sp.cust[0]===sp.cust[1]?'':' · '+esc(sp.cust[1])}<small>${sp.cust[2]?fmtMob(sp.cust[2])+' · ':''}tap to change</small>`:t('who')}</span></button>
  ${sp.lines.map((k,i)=>`<div class="li"><div class="r1"><span class="tag" style="border:0;color:var(--soft)">${i+1}</span><b>${bagLabel(nbs,i)}</b><span class="tag">steady</span><span class="kgbox">${f2(k)} kg</span></div><div class="r1"><span class="tag">${cnoL()} ${sp.cnos[i]||'—'}</span><span class="stpr" style="margin:0"><button onclick="slipNb(${i},-1)">−</button><b>${nbs[i]}</b><button onclick="slipNb(${i},1)">+</button></span><span style="flex:1"></span><button class="xbtn" onclick="slipNbs();S.slip.lines.splice(${i},1);S.slip.cnos.splice(${i},1);S.slip.nbs.splice(${i},1);if(!S.slip.lines.length)S.view='pick';render()">${ic('x')}</button></div></div>`).join('')}
  <div class="total"><small>${bagTxt(sum(nbs))} · ${f1(kg)} kg<br><span style="color:#B8C6E6">${est.due<0?'Customer owes shop':sp.cake==='SHOP'?'Shop pays (estimate)':'Customer pays (estimate)'}</span></small><b>${inr(est.due)}</b></div>
  <div class="note acct" style="padding:0 4px"><div class="ar"><span>Crushing ${f1(kg)} kg × ₹${est.rate}</span><b>${inr(est.gross)}</b></div>${sp.advC?`<div class="ar"><span>− customer advance</span><b>${inr(sp.advC)}</b></div>`:''}${sp.advA?`<div class="ar"><span>− tempo advance</span><b>${inr(sp.advA)}</b></div>`:''}${est.cans?`<div class="ar"><span>${sp.cake==='SHOP'?'− cans taken':'+ cans taken'}</span><b>${inr(est.cans)}</b></div>`:''}</div>
  <div class="cake" data-f="khalichg"><button class="${sp.cake==='SHOP'?'sel':''}" onclick="S.slip.cake='SHOP';render()">${icoSvg('khali',30)}${ic('shop')}<br>Shop keeps khali (oil cake)<small>₹6/kg · split customer/auto</small></button><button class="${sp.cake==='CUSTOMER'?'sel':''}" onclick="S.slip.cake='CUSTOMER';render()">${icoSvg('khali',30)}${ic('user')}<br>Customer takes khali (oil cake)<small>₹10/kg of seed</small></button></div>
  <div class="sec"><div class="grp"><span class="gi" style="background:#C98A25">${ic('rupee')}</span>Taken by customer · advance and cans</div>
  <button class="mrow" data-f="adv" onclick="sheetNum('Customer advance (₹)',v=>{S.slip.advC=v;closeLayer()},'closeLayer()')"><span class="coin">₹</span><span class="arr out">↑</span><span class="sp">Customer advance</span><span class="amt">${sp.advC?inr(sp.advC):'₹ —'}</span>${ic('edit')}</button>
  <button class="mrow" data-f="adv" onclick="sheetNum('Tempo advance (₹)',v=>{S.slip.advA=v;closeLayer()},'closeLayer()')"><span class="coin">${ic('auto')}</span><span class="arr out">↑</span><span class="sp">Tempo advance</span><span class="amt">${sp.advA?inr(sp.advA):'₹ —'}</span>${ic('edit')}</button>
  <div class="cans3" data-f="cans">${CANK.map(([k,ico,n])=>{const q=sp.cans[k]||0;return `<div class="cn3 ${q?'on':''}">${icoSvg(ico,46)}<b>${n}</b><small>₹${CANS[k]} each</small><div class="stpr"><button onclick="slipCan('${k}',-1)">−</button><b>${q}</b><button onclick="slipCan('${k}',1)">+</button></div></div>`}).join('')}</div></div>
  <div class="chrow"><button class="ch ${sp.stick?'sel':''}" data-f="stick" onclick="S.slip.stick=!S.slip.stick;render()">${ic('tag')||''}Bag stickers ${sp.stick?'ON':'OFF'}</button><button class="ch ${sp.copies>1?'sel':''}" onclick="S.slip.copies=S.slip.copies>1?1:2;render()">${S.slip.copies} receipt(s)</button></div>
  <div class="act"><button onclick="clearSlip()"><span style="color:#F06C57">${ic('x')}</span>${t('clear')}</button><button class="hold" data-f="hold" onclick="parkSlip()">${ic('pause')}${t('hold')}</button>
   <button class="okb ${!needCust?'sbtn go next':''}" id="okb" onclick="confirmSlip()"><span>${ic('printer')}${ic('check')}</span>Token · ${f1(kg)} kg</button></div></div>`}
IC.tag='<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.1"/>';

/* ---------- tapping an item ---------- */
function afterSave(){S.needZero=true;if(navigator.vibrate)navigator.vibrate(80);render()}
function tapItem(k){if(k==='can15'||k==='can5new'||k==='can5old'){sheetCanJob(k);return}
 if(!ready())return;const raw=S.scale.w,can=(k==='ooil'||k==='coil');const kg=r2(can?raw-S.canTare:raw);
 if(kg<=0)return toast('Weight is below the empty can','bad');
 if(k==='bfull'||k==='bempty'||k==='bout'){if(S.mode==='worker'){trayAdd(k,r2(raw));return}sheetBarrel(k,r2(raw));return}
 if(S.mode==='worker'){trayAdd(k,kg);return}
 S.wdone=null;
 if(k==='cseed'){S.slip.lines.push(kg);S.view='slip';afterSave();return}
 if(k==='coil'){sheetJobPick('Customer oil '+f1(kg)+' kg — whose?',j=>{j.oilKg=kg;toast(j.customer+' · oil '+f1(kg)+' kg weighed');afterSave();sheetHeld()},j=>j.crushed&&!j.given);return}
 if(k==='ckhali'){sheetJobPick('Customer khali '+f1(kg)+' kg — whose?',j=>giveKhali(j,kg),j=>j.crushed&&j.khaliKg==null);return}
 if(k==='ooil'){sheetTank(kg);return}
 const key=k;(S.own[key]=S.own[key]||[]).push(kg);if(k==='oseed'){const r=newRun([{kg,nb:1,time:clock()}]);toast('Seed '+f1(kg)+' kg · Run '+rserial(r)+' to start')}else toast(IT[k].wl+' '+f1(kg)+' kg saved');afterSave()}
function giveKhali(j,kg){j.khaliKg=kg;if(j.cake==='SHOP'){j.cake='CUSTOMER';j.settled=false}toast(`Khali handed over → ₹10/kg of ${f1(j.seedKg)} kg seed = ${inr(j.seedKg*10)}`);afterSave();sheetHeld()}

/* ---------- layer / sheets ---------- */
const LAYER_IC=[[/^Customer advance|^Tempo advance/,'rupee'],[/^Customer$/,'user'],[/^Jobs/,'jc'],[/^Parked/,'park'],[/^Printed|^Token/,'printer'],[/^Waiting/,'hourg'],[/^Our mill/,'own'],[/^Our oil|^Customer oil|^Customer khali|^Add /,'drop']];
function layer(title,body,close='closeLayer()'){const l=$('#layer');
 if(title.indexOf('<')<0){const m=LAYER_IC.find(x=>x[0].test(title));if(m)title=(m[1]==='jc'?jcIcon(28):m[1]==='own'?ownIcon(28):ic(m[1]))+' '+title}
 else if(/<small/.test(title)&&title.indexOf('class="ic')<0)title=jcIcon(28)+' '+title;
 l.classList.add('on');l.innerHTML=`<div class="lh"><h2>${title}</h2><button class="pill" onclick="${close}">${ic('x')}</button></div><div class="lb">${body}</div>`}
function closeLayer(){$('#layer').classList.remove('on');render()}
function toast(m,kind){const e=$('#toast');e.innerHTML=(kind==='bad'?ic('x'):ic('check'))+esc(m);e.className='toast on'+(kind==='bad'?' bad':'');clearTimeout(toast.t);toast.t=setTimeout(()=>{e.className='toast'},Math.max(2400,String(m).length*55))}
function sheetCust(){layer('Customer',`${inpW('<input class="inp" id="cq" placeholder="Search name, village or mobile" oninput="custFilter()" autocomplete="off">','cq','text')}<div id="cres"></div>
 <div class="card"><h3>${ic('plus')} New customer</h3>${inpW('<input class="inp" id="nc" placeholder="Name (optional)" autocomplete="off">','nc','name')}
 <div style="height:8px"></div>${inpW('<input class="inp" id="nm" inputmode="numeric" maxlength="14" placeholder="Mobile number (optional)" autocomplete="off">','nm','digits')}
 <div class="chrow">${PLACES.map(p=>`<button class="ch" onclick="newCust('${p}')">${ic('pin')} ${p}</button>`).join('')}</div><div class="note">Name and mobile are optional. Tap the village to save. With no name, the village is the customer.</div></div>`);custFilter()}
function custFilter(){const q=(($('#cq')||{}).value||'').trim().toLowerCase(),qd=q.replace(/\D/g,''),m=(t)=>!q||String(t||'').toLowerCase().includes(q)||(qd.length>=3&&String(t||'').includes(qd));
 const cs=CUSTS.map((c,i)=>[c,i]).filter(([c])=>m(c[0])||m(c[1])||m(c[2])),vs=PLACES.filter(m);
 $('#cres').innerHTML=(cs.length?`<div class="chrow">${cs.map(([c,i])=>`<button class="ch" onclick="S.slip.cust=CUSTS[${i}];closeLayer()">${c[0]===c[1]?ic('pin'):ic('user')} ${esc(c[0])}${c[0]===c[1]?'':`<br><small style="color:var(--soft);font:500 13px var(--body)">${ic('pin')} ${esc(c[1])}${c[2]?' · '+ic('phone')+' '+fmtMob(c[2]):''}</small>`}</button>`).join('')}</div>`:'')
 +(vs.length?`<div class="grp" style="margin-top:10px"><span class="gi" style="background:#2E7D5B">${ic('pin')}</span>Village only (no name)</div><div class="chrow">${vs.map(p=>`<button class="ch" onclick="S.slip.cust=['${p}','${p}'];closeLayer()">${ic('pin')} ${p}</button>`).join('')}</div>`:'')
 +(!cs.length&&!vs.length?'<div class="note">No match. Add a new customer below.</div>':'')}
function newCust(p){const n=($('#nc').value||'').trim()||p,mb=cleanMobile($('#nm')?$('#nm').value:'');if(mb===null)return toast('Mobile number must be 10 digits, or leave it empty','bad');const c=[n,p,mb||''];if(n!==p&&!CUSTS.find(x=>x[0]===n&&x[1]===p))CUSTS.push(c);S.slip.cust=c;closeLayer()}
function sheetNum(title,cb,back){window.__numSet=cb;window.__numBack=back;S._adv='';layer(title,`<div class="mrow" style="justify-content:flex-end"><button type="button" class="vbtn mic" data-f="voice" id="mb-advv" onclick="micAmount()" aria-label="Speak the amount">${ic('mic')}</button><span class="amt" id="advv" style="color:var(--ink);font-size:34px">₹ 0</span></div>
 <div class="pad">${[1,2,3,4,5,6,7,8,9,'C',0,'OK'].map(k=>`<button onclick="padKey('${k}')">${k}</button>`).join('')}</div>`,back)}

function confirmSlip(){const sp=S.slip;if(!sp.cust)return toast('Choose the customer first','bad');
 const tok='JW-'+pad(S.nextJw++),kg=r2(sum(sp.lines)),nbs=slipNbs().slice(),j={id:uid('J'),nb:sum(nbs),tok,customer:sp.cust[0],place:sp.cust[1],mobile:sp.cust[2]||'',lines:sp.lines.slice(),seedKg:kg,cake:sp.cake,advC:sp.advC||0,advA:sp.advA||0,cans:Object.assign({},sp.cans),time:clock(),crushed:false,settled:false,given:false,method:'cash'};

 layer('Token printed',`<div class="note">${sp.copies} receipt(s): one for the customer, one stuck on the bags${sp.stick?' · stickers print per customer no.':''}. The codes below are real and scan.</div><div id="prst" class="prst"></div>

function bcSvg(text){try{const s=document.createElementNS('http://www.w3.org/2000/svg','svg');JsBarcode(s,text,{format:'CODE128',displayValue:false,height:40,width:2,margin:0,background:'transparent'});const w=parseFloat(s.getAttribute('width')),h=parseFloat(s.getAttribute('height'));s.setAttribute('viewBox','0 0 '+w+' '+h);s.setAttribute('preserveAspectRatio','none');s.removeAttribute('width');s.removeAttribute('height');s.style.width='100%';s.style.height='100%';return s.outerHTML}catch(e){return ''}}

function groups(){const g={};S.queue.forEach(x=>{const key=x.k+'|'+(x.cno||0);(g[key]=g[key]||{k:x.k,cno:x.cno||0,items:[]}).items.push(x)});return Object.values(g)}
function wMoveCno(gi,n){groups()[gi].items.forEach(x=>x.cno=n);sheetWaiting()}
function wBarrel(gi){const g=groups()[gi],x=g.items[0],k=x.k,kg=x.kg;
 layer((k==='bfull'?'Full barrel ':k==='bempty'?'Empty barrel ':'Barrel out · ')+f1(kg)+' kg — which barrel?',`<div class="chrow">${Array.from({length:20},(_,i)=>{const c='BRL-'+String(i+1).padStart(2,'0'),b=S.barrels[c]||{};return `<button class="ch" onclick="wBarrelDo('${x.id}','${k}','${c}',${kg})"><div style="display:flex;align-items:center;gap:6px">${icoSvg(b.full&&!b.empty?'bfull':'bempty',26)}${c.slice(4)}</div></button>`}).join('')}</div>`,'sheetWaiting()')}
function wBarrelDo(id,k,c,kg){S.queue=S.queue.filter(x=>x.id!==id);const b=S.barrels[c]=S.barrels[c]||{};
 if(k==='bfull'){b.full=kg;b.empty=null;toast(c+' full · '+f1(kg)+' kg')}else if(k==='bempty'){b.empty=kg;toast(b.full?c+' emptied · oil in it = '+f1(b.full-kg)+' kg':c+' empty '+f1(kg)+' kg (tare)')}else{b.out=true;toast(c+' sent out')}
 sheetWaiting()}
function wCOil(gi){const g=groups()[gi],kg=sum(g.items.map(x=>x.kg));sheetJobPick('Customer oil '+f1(kg)+' kg — whose?',j=>{const gg=takeG(groupsIdx(g));j.oilKg=sum(gg.items.map(x=>x.kg));toast(j.customer+' · oil '+f1(j.oilKg)+' kg');sheetWaiting()},j=>j.crushed&&!j.given)}
function wFilter(f){S.wf=f;sheetWaiting()}
function sheetWaiting(){const gs=groups();
 const cnt=f=>f==='all'?S.queue.length:S.queue.filter(x=>KIND(x.k)===f).length;
 const kgOf=f=>sum(S.queue.filter(x=>KIND(x.k)===f).map(x=>x.kg));
 const sumBar=S.queue.length?`<div class="wsum">${[['seed','seed'],['oil','drop'],['khali','bag']].filter(([f])=>cnt(f)).map(([f,ico])=>`<span class="pc tk">${ic(ico)}${f==='khali'?'Khali · Oil cake':f[0].toUpperCase()+f.slice(1)} ${f1(kgOf(f))} kg · ${f==='oil'?cnt(f)+' cans':bagTxt(sum(S.queue.filter(x=>KIND(x.k)===f).map(x=>x.nb||1)))}</span>`).join('')}${cnt('bar')?`<span class="pc tk">${ic('barrel')}Barrels · ${cnt('bar')}</span>`:''}</div>`:'';
 const filt=`<div class="wf">${KINDS.filter(([f])=>f==='all'||cnt(f)).map(([f,n,ico])=>`<button class="${S.wf===f?'sel':''}" onclick="wFilter('${f}')">${ic(ico)}${n}<b>${cnt(f)}</b></button>`).join('')}</div>`;
 const cards=gs.map((g,gi)=>{if(S.wf!=='all'&&KIND(g.k)!==S.wf)return '';const i=IT[g.k],kg=sum(g.items.map(x=>x.kg)),cust=isCust(g.k);
  const nx=gi===0?' next':'';const acts=g.k==='cseed'?`<button class="sbtn go${nx}" onclick="wNewJob(${gi})">${ic('plus')}New job</button><button class="sbtn" data-f="addjob" onclick="wToJob(${gi})">${ic('list')}Add to a job</button>`

   :g.k==='okhali'?`<button class="sbtn go" onclick="wOwn(${gi},'okhali')">${icoSvg('khali',26)}To khali stack</button>`

   :KIND(g.k)==='bar'?`<button class="sbtn go${nx}" onclick="wBarrel(${gi})">${ic('barrel')}Which barrel?</button>`
   :`<button class="sbtn go" onclick="wOwn(${gi},'${g.k}')">${ic('check')}Save</button>`;
  const bagBtns=cust?`<div class="bagrow" style="padding:0"><span>${cnoL()}</span>${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="${g.cno===n?'sel':''}" onclick="wMoveCno(${gi},${n})">${n}</button>`).join('')}</div>`:'';
  return `<div class="card">${whead(gi+1,g.items[0].time,gi)}<h3>${art(i)}${esc(S.lang==='kn'?i.kn:i.wl)}${g.cno?`<span class="bagchip" style="margin-left:auto">${cnoL()} ${g.cno}</span>`:''}</h3>
   <div class="wtot"><b>${f1(kg)} kg</b><small>${isBagK(g.k)?bagTxt(sum(g.items.map(x=>x.nb||1)))+' · ':''}${g.items.length} weighing(s)</small></div>
   ${g.items.map(x=>`<div class="wl1"><span>${x.time}</span><span>${esc(x.by)}</span>${isBagK(x.k)?`<span>${bagTxt(x.nb||1)}</span>`:''}${x.slip?`<span>${x.slip}</span>`:''}${x.voice?`<button class="vp" onclick="toast('Playing voice note · ${x.voice} s')">${ic('mic')}${x.voice}s</button>`:''}${x.photo?`<button class="vp" onclick="toast('Photo of the bags opens here')">${ic('camera')}photo</button>`:''}<b>${f2(x.kg)}</b></div>`).join('')}
   ${bagBtns}<div class="two" style="grid-template-columns:1fr 1fr">${acts}</div></div>`}).join('');
 layer('Waiting list'+(S.queue.length?` · ${S.queue.length}`:''),(S.queue.length?`<div class="note">What the workers weighed. Sort each group. The weights cannot be changed, but a load can be moved to another bag no.</div>${sumBar}${filt}${cards}`:`<div class="note" style="text-align:center;padding:30px 0">${ic('check')}<br>Nothing waiting. Workers' weighings appear here.</div>`))}
const takeG=gi=>{const g=groups()[gi];S.queue=S.queue.filter(x=>!g.items.includes(x));return g};

  // own mill production runs: "run 2 done", "start run 3", "put run 3 in machine"
  const rm=s.match(/\brun\s*(?:no\.?|number)?\s*(\d{1,3})\b/);
  if(rm)return out({t:'run',n:+rm[1],act:has(/\b(done|finished|finish|complete|completed|crushed)\b/)?'done':has(/\b(start|started|begin|put|load|machine|in)\b/)?'start':'open'});
  // job reference: "token 3", "job 3", "serial 3" -> serial of today
  let ref=null;
  const tm=s.match(/\b(?:token|serial|no|number|job)\s*(?:no\.?|number)?\s*(\d{1,4})\b/);
  if(tm&&!/\bmobile\b/.test(s.slice(Math.max(0,tm.index-8),tm.index)))ref={serial:+tm[1]};
  const inv=s.match(/\b(?:invoice|inv|bill)\s*#?\s*(\d{1,5})\b/);
  if(inv)ref={inv:inv[1].padStart(4,'0')};

  // quick intent words
  const wantsCrushed=has(/\bcrushed\b|\bcrushing\b.*\bdone\b|\bdone\b.*\bcrush|\bmark (it )?done\b|\bfinished\b|\bcomplete(d)?\b/);
  const wantsOilOut=has(/\boilout\b|\boil (out|given|gave|delivery)\b|\bgive (the )?oil\b/);
  const wantsPay=has(/\b(pay|paid|payment|settle)\b/)&&!has(/\badvance\b/);

  // advance (customer / tempo)
  if(has(/\badvance\b/)){
    const am=s.match(/\badvance\b\D{0,12}?(\d+(?:\.\d+)?)/)||s.match(/(\d+(?:\.\d+)?)\D{0,8}\badvance\b/)||(nums.length?[0,nums[nums.length-1]]:null);
    const who=has(/\btempo\b|\bdriver\b/)?'tempo':'cust';
    if(am)return out({t:'adv',who,amt:Math.round(+am[1]),ref});
    return out({t:'adv',who,amt:null,ref,need:'amount'})}
  // khali ownership
  if(has(/\bkhali\b/)&&has(/\b(shop|we keep|keeps|keep)\b|\bcustomer\b|\btakes?\b|\bcarry\b/)){
    const cust=has(/\bcustomer (takes?|will take|carry|takes it)\b|\btakes?\b.*\bcustomer\b|\bcustomer\b.*\bkhali\b.*\btakes?\b|\bcustomer\b/)&&!has(/\bshop\b.*\bkeeps?\b|\bshop (will )?keep/)&&!has(/\bshop\b/);
    return out({t:'khali',who:cust?'CUSTOMER':'SHOP',ref})}
  if(has(/\bkhali\b/)&&has(/\bshop\b/))return out({t:'khali',who:'SHOP',ref});
  // mobile for the customer being created / chosen
  if(phone&&!has(/\b(customer|village)\b\s+[a-z]{3,}/)){return out({t:'mobile',value:phone})}

  // navigation (screens)
  for(const k of Object.keys(NAV))if(NAV[k].test(s)&&!wantsCrushed&&!wantsOilOut&&!wantsPay&&!ref&&!has(/\bkhali\b/)){
    if(k==='held'&&has(/\bhold\b/)&&has(/\bpark|\bhold (it|the slip|this)\b/))break;
    return out({t:'nav',to:k})}

  // pending customer fields
  const cm=s.match(/\b(?:customer|name|called|named)\s+([^\d]+?)(?=\s+(?:village|from|of|in|mobile|number|phone|at)\b|$)/);
  const vm=s.match(/\b(?:village|from|of|in|at)\s+([^\d]+?)(?=\s+(?:mobile|number|phone|customer|name)\b|$)/);
  const wantsNew=has(/\bnew customer\b|\badd customer\b|\bnew party\b|\bcreate customer\b/);

  // job actions on a named customer or token
  const jobCands=(ctx.jobs||[]).map(j=>({id:j.tok,names:[j.customer,j.place].filter(Boolean),j}));
  const findJob=()=>{
    if(ref&&ref.serial){const j=(ctx.jobs||[]).filter(x=>x.serial===ref.serial);if(j.length===1)return {job:j[0]};if(j.length>1)return {many:j.slice(0,4)}}
    if(ref&&ref.inv){const j=(ctx.jobs||[]).find(x=>String(x.tok).replace(/\D/g,'')===ref.inv);if(j)return {job:j}}
    if(ctx.cardOpen&&!cm&&!vm){const j=(ctx.jobs||[]).find(x=>x.tok===ctx.cardOpen);if(j)return {job:j}}
    const left=s.split(' ').filter(w=>!STOP.has(w)&&!/^\d+(\.\d+)?$/.test(w)).join(' ');
    if(left){const r=matchBest(left,jobCands);if(r.length){if(r.length>1&&r[0].score-r[1].score<0.04&&r[0].c.j.customer!==r[1].c.j.customer)return {many:r.slice(0,4).map(x=>x.c.j)};return {job:r[0].c.j,score:r[0].score}}}
    return {}};
  if(wantsCrushed||wantsOilOut||wantsPay){
    const f=findJob();
    const kind=wantsCrushed?'crushed':wantsOilOut?'oilout':'pay';
    if(f.job)return out({t:'jobact',act:kind,tok:f.job.tok});
    if(f.many)return out({t:'pick',act:kind,options:f.many.map(j=>j.tok)});
    return out({t:'jobact',act:kind,tok:null,need:'job'})}
  if(ref||(/\b(job card|jobcard|card)\b/.test(s))){
    const f=findJob();
    if(f.job)return out({t:'job',tok:f.job.tok});
    if(f.many)return out({t:'pick',act:'open',options:f.many.map(j=>j.tok)});
    if(ref)return out({t:'job',tok:null,need:'job',ref})}

  // customer selection / creation
  const places=(ctx.places||[]).map(p=>({id:p.name,names:[p.name].concat(p.aliases||[])}));
  const custs=(ctx.customers||[]).map((c,i)=>({id:i,names:[c.name].concat(c.aliases||[]),c}));
  const leftover=s.split(' ').filter(w=>!STOP.has(w)&&!/^\d+(\.\d+)?$/.test(w)&&!/^[6-9]\d{9}$/.test(w));
  let nameQ=cm?cm[1].trim():'',placeQ=vm?vm[1].trim():'';
  if(!nameQ&&!placeQ&&leftover.length){
    const q=leftover.join(' ');
    // bare words: first try a customer, then a village, then "name village"
    const cr=matchBest(q,custs),pr=matchBest(q,places);
    if(!wantsNew&&cr.length&&(!pr.length||cr[0].score>=pr[0].score)){
      if(cr.length>1&&cr[0].score-cr[1].score<0.04&&cr[0].c.c.name!==cr[1].c.c.name)return out({t:'pickCust',options:cr.slice(0,4).map(x=>x.id)});
      return out({t:'cust',mode:'select',idx:cr[0].id,score:cr[0].score,mobile:phone})}
    if(!wantsNew&&pr.length)return out({t:'cust',mode:'village',place:pr[0].id,score:pr[0].score,mobile:phone});
    if(wantsNew)nameQ=q;else return out({t:'unknown',conf:0,guess:q})}
  if(nameQ||placeQ||wantsNew){
    let pl=null;
    if(placeQ){const pr=matchBest(placeQ,places);if(pr.length)pl=pr[0].id;else pl=placeQ.replace(/\b\w/g,c=>c.toUpperCase())}
    // a trailing village inside the name ("ramesh bhalki")
    if(nameQ&&!pl){const ws=nameQ.split(' ');if(ws.length>1){const last=ws[ws.length-1],pr=matchBest(last,places);if(pr.length&&pr[0].score>=0.85){pl=pr[0].id;nameQ=ws.slice(0,-1).join(' ')}}}
    // existing customer?
    if(nameQ&&!wantsNew){const cr=matchBest(nameQ,custs);if(cr.length&&cr[0].score>=0.8&&(!pl||sim(cr[0].c.c.place,pl)>0.8||true)){
      if(cr.length>1&&cr[0].score-cr[1].score<0.04&&cr[0].c.c.name!==cr[1].c.c.name)return out({t:'pickCust',options:cr.slice(0,4).map(x=>x.id)});
      return out({t:'cust',mode:'select',idx:cr[0].id,score:cr[0].score,mobile:phone})}}
    if(!nameQ&&pl)return out({t:'cust',mode:'village',place:pl,mobile:phone});
    const nm=nameQ.replace(/\b\w/g,c=>c.toUpperCase());
    return out({t:'cust',mode:'new',name:nm||null,place:pl,mobile:phone})}
  return out({t:'unknown',conf:0})}

const api={normalize,parse,matchBest,sim,key};
if(typeof module!=='undefined'&&module.exports)module.exports=api;else root.MillVoice=api;

 R:()=>window.SpeechRecognition||window.webkitSpeechRecognition,

S.runs=[
 {id:'R1',time:'20 Nov 08:30 AM',seedKg:287.4,nb:6,state:'done',tMachine:'08:45 AM',tCrushed:'10:20 AM',tDone:'11:05 AM',oil:[[15.2,'Floor barrel'],[16.1,'Floor barrel'],[17.0,'Floor barrel']]},
 {id:'R2',time:'20 Nov 10:40 AM',seedKg:241.2,nb:5,state:'machine',tMachine:'10:50 AM',oil:[]},
 {id:'R3',time:'20 Nov 11:30 AM',seedKg:240.0,nb:5,state:'weighed',oil:[]}];
const TANKS=['K2','Floor barrel','Small tank'];
const rserial=r=>S.runs.indexOf(r)+1;
const runsActive=()=>S.runs.filter(r=>r.state!=='done').length;
const runOilKg=r=>r2(sum(r.oil.map(x=>x[0])));
function newRun(items){const r={id:'R'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),time:items[0].time||clock(),seedKg:r2(sum(items.map(x=>x.kg))),nb:sum(items.map(x=>x.nb||1)),state:'weighed',oil:[]};S.runs.push(r);return r}
// our oil can going into a tank belongs to the run that was just crushed (only when exactly one is waiting for oil)
function oilToRun(kg,tank){const w=S.runs.filter(r=>r.state==='oil');if(w.length===1){w[0].oil.push([kg,tank]);return w[0]}return null}
function runSteps(r){
 const st=[['seed','Seed weighed',true],['crush','Crushing',r.state==='oil'||r.state==='done'],['drop','Oil weighed',r.oil.length>0],['tank','In tank',r.state==='done']];
 const cur=st.findIndex(x=>!x[2]);
 return `<div class="steps">${st.map((x,i)=>`<div class="stp ${x[2]?'ok':i===cur?'cur':''}"><span>${x[0]==='crush'?ownIcon(26):ic(x[0])}${x[2]?`<i class="tk">${ic('check')}</i>`:''}</span><small>${x[1]}</small></div>`).join('<i class="sep"></i>')}</div>`}
function runAct(r){
 if(r.state==='weighed')return `<button class="sbtn go next" style="min-height:64px" onclick="runStart('${r.id}')">${ownIcon(28)}${ic('arrowr')}Put seed in machine</button>`;
 if(r.state==='machine')return `<button class="sbtn go next" style="min-height:64px" onclick="runCrushed('${r.id}')">${ownIcon(28)}${ic('check')}Crushing done</button>`;
 if(r.state==='oil')return (r.oil.length?`<button class="sbtn go next" style="min-height:64px" onclick="runFinish('${r.id}')">${ic('tank')}${ic('check')}Run finished · oil in tank</button>`:'')
  +`<button class="sbtn ${r.oil.length?'':'go next'}" style="min-height:58px" onclick="sheetRunOil('${r.id}')">${ic('drop')}${ic('arrowr')}${ic('tank')}Add oil can to tank</button>`;
 return `<div class="st ok">${ic('check')} Done · oil ${f1(runOilKg(r))} kg in tank</div>`}
function runCard(r){
 const n=rserial(r),oilPills=r.oil.map(x=>`<span class="pc gd">${ic('drop')} ${f1(x[0])} kg → ${ic('tank')} ${esc(x[1])}</span>`).join('');
 const since=r.state==='machine'?`<div class="note" style="padding:0">${ownIcon(20)} In machine since <b>${r.tMachine}</b></div>`:'';

  ${runSteps(r)}${since}${oilPills?`<div class="pillrow">${oilPills}</div>`:''}${runAct(r)}</div>`}
function sheetMill(){
 const by=s=>S.runs.filter(r=>r.state===s);
 const sec=(t,ico,col,l)=>l.length?`<div class="grp"><span class="gi" style="background:${col}">${ico==='own'?ownIcon(22):ic(ico)}</span>${t} (${l.length})</div>`+l.map(runCard).join(''):'';
 const o=S.own,sum2=`<div class="wsum"><span class="pc tk">${ic('seed')}Seed ${f1(sum(o.oseed))} kg</span><span class="pc tk">${ic('drop')}Oil ${f1(sum(o.ooil.map(x=>x[0])))} kg</span><span class="pc tk">${ic('bag')}Khali · Oil cake ${f1(sum(o.okhali))} kg</span></div>`;
 layer('Our mill · production',sum2+`<div class="note">Our own seed: weigh the seed, put it in the machine, then weigh the oil and put it in the tank. Tap the glowing button for the next step.</div>`
  +sec('To start · seed weighed','seed','#C98A25',by('weighed'))+sec('In machine · crushing','own','#C98A25',by('machine'))+sec('Oil to tank','drop','#5F82D4',by('oil'))+sec('Done today','check','#3F9D63',by('done'))
  +(S.runs.length?'':'<div class="note">No run yet. Weigh the seed, then in Waiting tap “Add to today’s crushing”.</div>'))}
function runStart(id){const r=S.runs.find(x=>x.id===id);if(!r||r.state!=='weighed')return;r.state='machine';r.tMachine=t12(new Date());toast('Seed in machine · Run '+rserial(r));sheetMill();render()}
function runCrushed(id){const r=S.runs.find(x=>x.id===id);if(!r||r.state!=='machine')return;r.state='oil';r.tCrushed=t12(new Date());toast('Crushing done · weigh the oil next');sheetMill();render()}
function runFinish(id){const r=S.runs.find(x=>x.id===id);if(!r||r.state!=='oil'||!r.oil.length)return;r.state='done';r.tDone=t12(new Date());toast('Run '+rserial(r)+' finished · '+f1(runOilKg(r))+' kg oil in tank');sheetMill();render()}

 layer(`Add oil can · Run ${rserial(r)}`,q.length?`<div class="note">Pick the weighed can, then the tank it goes into.</div>`+q.map(x=>`<div class="card"><h3>${ic('drop')} ${f1(x.kg)} kg <span class="t">${x.time}</span></h3><div class="chrow">${TANKS.map(tk=>`<button class="ch" onclick="runOil('${id}','${x.id}','${tk}')">${ic('tank')} ${tk}</button>`).join('')}</div></div>`).join('')
  :`<div class="note">${ic('hand')} No oil can is waiting. Weigh the oil can on the scale first (tile 5 · Our oil can).</div><button class="sbtn" onclick="sheetMill()">${ic('arrowr')}Back</button>`,'sheetMill()')}
function runOil(id,qid,tank){const r=S.runs.find(x=>x.id===id),qi=S.queue.findIndex(x=>x.id===qid);if(!r||qi<0)return;const x=S.queue.splice(qi,1)[0];r.oil.push([x.kg,tank]);S.own.ooil.push([x.kg,tank]);toast(f1(x.kg)+' kg → '+tank);sheetMill();render()}
function sayRun(id){const r=S.runs.find(x=>x.id===id);if(!r)return;const st={weighed:'Waiting to go in the machine',machine:'In the machine, crushing',oil:'Crushed. Oil to tank',done:'Done'}[r.state];TTS.say(`Run ${rserial(r)}. Seed ${f1(r.seedKg)} kilos, ${bagTxt(r.nb)}. ${st}.${r.oil.length?' Oil '+f1(runOilKg(r))+' kilos.':''}`,'en-IN')}

applyCfg();document.getElementById('fab').innerHTML=ic('bot');
/* ===================== LIVE LAYER (production) =====================
   Real scale (from the app page around this screen), server sync of jobs, waiting list,
   runs, own weighings, customers and barrels, offline cache, printing.
   Standalone (opened on its own or with ?demo=1): keeps the demo scale and demo data. */
(function(){
const DEMO=/[?&]demo=1/.test(location.search);
if(window.parent===window&&!DEMO&&/^\/mill\//.test(location.pathname)){location.replace('/mill');return}
const LIVE=window.parent!==window&&!DEMO;
window.MILL_LIVE=LIVE;
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
window.uid=uid;
const OWNK=['oseed','ooil','okhali','sed','other','sbuy','kbuy','obuy','osell','ksell'];
const LS='milldesk.state.v1';
// stable stringify (Postgres JSONB re-orders keys, so compare by sorted keys)
const canon=v=>JSON.stringify(v,function(k,x){if(x&&typeof x==='object'&&!Array.isArray(x)){const o={};Object.keys(x).sort().forEach(y=>o[y]=x[y]);return o}return x});
const ckey=c=>(String(c[0]||'')+'|'+String(c[1]||'')).toLowerCase();
const SY={snap:{job:{},q:{},run:{},cust:{},barrel:{}},own:{},oid:{},busy:false,again:false,pushSeq:0,online:true,pending:0,loaded:false,cur:null,next:null,needRender:false,timer:null};
window.SY=SY;
S.khali=null;
function lists(){return{job:S.jw,q:S.queue,run:S.runs,cust:CUSTS.map(c=>({id:ckey(c),name:c[0],place:c[1],mobile:c[2]||''})),
 barrel:Object.keys(S.barrels||{}).map(k=>Object.assign({id:k},S.barrels[k]))}}
function ensureIds(){S.jw.forEach(j=>{if(!j.id)j.id=uid('J')});S.queue.forEach(x=>{if(!x.id||/^Q\d+$/.test(x.id))x.id=uid('Q')});S.runs.forEach(r=>{if(!r.id)r.id=uid('R')})}
function pendingCount(){let n=0;const L=lists();for(const k in L){const sn=SY.snap[k];const ids=new Set();L[k].forEach(x=>{ids.add(x.id);if(sn[x.id]!==canon(x))n++});if(k==='q'||k==='job')for(const id in sn)if(!ids.has(id))n++}
 OWNK.forEach(k=>{n+=Math.max(0,(S.own[k]||[]).length-(SY.own[k]||0))});return n}
function batch(){ensureIds();const L=lists(),up={},del={};
 for(const k in L){const sn=SY.snap[k];const ids=new Set();up[k]=[];L[k].forEach(x=>{ids.add(x.id);const c=canon(x);if(sn[x.id]!==c)up[k].push(JSON.parse(c))});
  if(k==='q'){del.q=Object.keys(sn).filter(id=>!ids.has(id))}}
 // an entry keeps the same id until the server has it, so a retry after a lost reply cannot save it twice
 const own=[];OWNK.forEach(k=>{const a=S.own[k]||[],n=SY.own[k]||0;a.slice(n).forEach((v,i)=>{const q=k+'|'+(n+i);const id=SY.oid[q]||(SY.oid[q]=uid('O'));own.push({id,key:k,v,idx:n+i})})});
 const empty=!own.length&&!del.q.length&&Object.values(up).every(a=>!a.length);
 return empty?null:{up,del,own}}
function save(){try{localStorage.setItem(LS,JSON.stringify({at:Date.now(),jw:S.jw,queue:S.queue,runs:S.runs,own:S.own,custs:CUSTS,barrels:S.barrels,snap:SY.snap,ownSnap:SY.own,oid:SY.oid,nextJw:S.nextJw,wsn:S.wsn,me:S.me}))}catch(e){}}
function restore(){try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(!d||Date.now()-d.at>3*86400000)return false;
 S.jw=d.jw||[];S.queue=d.queue||[];S.runs=d.runs||[];S.own=Object.assign(emptyOwn(),d.own||{});CUSTS.length=0;(d.custs||[]).forEach(c=>CUSTS.push(c));S.barrels=d.barrels||{};
 SY.snap=Object.assign(SY.snap,d.snap||{});SY.own=d.ownSnap||{};SY.oid=d.oid||{};S.nextJw=d.nextJw||S.nextJw;S.wsn=d.wsn||S.wsn;if(d.me)S.me=d.me;return true}catch(e){return false}}
function emptyOwn(){return{cseedNote:0,oseed:[],ooil:[],okhali:[],sed:[],other:[]}}
async function push(){if(!LIVE||!SY.loaded)return;if(SY.busy){SY.again=true;return}
 const b=batch();SY.pending=b?pendingCount():0;paintSync();if(!b)return;
 SY.busy=true;SY.pushSeq++;
 try{const r=await fetch('/api/mill',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b),credentials:'same-origin'});
  if(r.status===401){location.reload();return}
  const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Not saved');
  for(const k in b.up)b.up[k].forEach(x=>{SY.snap[k][x.id]=canon(x)});
  (b.del.q||[]).forEach(id=>{delete SY.snap.q[id]});
  b.own.forEach(o=>{SY.own[o.key]=Math.max(SY.own[o.key]||0,o.idx+1);delete SY.oid[o.key+'|'+o.idx]});
  if(d.remap)Object.keys(d.remap).forEach(id=>{const j=S.jw.find(x=>x.id===id);if(j){toast('Invoice number changed to '+d.remap[id].replace('JW-','#')+' (another counter used it)');j.tok=d.remap[id];SY.snap.job[id]=canon(j)}});
  if(d.nextJw)S.nextJw=Math.max(S.nextJw,d.nextJw);
  SY.online=true;SY.pushSeq++}
 catch(e){SY.online=false;clearTimeout(SY.retry);SY.retry=setTimeout(push,4000)}
 finally{SY.busy=false;SY.pending=pendingCount();save();paintSync();if(SY.again){SY.again=false;setTimeout(push,50)}}}
function schedule(){if(!LIVE)return;save();clearTimeout(SY.timer);SY.timer=setTimeout(push,250)}
window.millSchedule=schedule;
function mergeList(kind,local,server){const sn=SY.snap[kind],lm=new Map(local.map(x=>[x.id,x])),out=[],seen=new Set();let ch=false;
 server.forEach(sx=>{seen.add(sx.id);const lx=lm.get(sx.id),c=canon(sx);
  if(lx&&sn[sx.id]!==canon(lx)){out.push(lx);return}// changed here, not sent yet: keep ours
  if(!lx||canon(lx)!==c)ch=true;sn[sx.id]=c;out.push(sx)});
 local.forEach(lx=>{if(seen.has(lx.id))return;if(sn[lx.id]!==undefined&&sn[lx.id]===canon(lx)){delete sn[lx.id];ch=true;return}// gone on the server
  out.push(lx)});
 return{out,ch}}
async function pull(){if(!LIVE||document.hidden)return;const seq=SY.pushSeq;
 try{const r=await fetch('/api/mill',{credentials:'same-origin',cache:'no-store'});if(r.status===401){location.reload();return}
  const d=await r.json();if(!r.ok)throw new Error(d.error||'');
  if(SY.busy||seq!==SY.pushSeq)return;// a save went out meanwhile: wait for the next pull
  let ch=false;S.me=d.me||S.me;
  let m=mergeList('job',S.jw,d.jobs||[]);S.jw=m.out;ch=ch||m.ch;
  m=mergeList('q',S.queue,d.queue||[]);S.queue=m.out;ch=ch||m.ch;
  m=mergeList('run',S.runs,d.runs||[]);S.runs=m.out;ch=ch||m.ch;
  const lc=CUSTS.map(c=>({id:ckey(c),name:c[0],place:c[1],mobile:c[2]||''}));
  m=mergeList('cust',lc,d.custs||[]);if(m.ch){CUSTS.length=0;m.out.forEach(c=>CUSTS.push([c.name,c.place,c.mobile||'']));ch=true}
  const lb=Object.keys(S.barrels||{}).map(k=>Object.assign({id:k},S.barrels[k]));
  m=mergeList('barrel',lb,d.barrels||[]);if(m.ch){const b={};m.out.forEach(x=>{const y=Object.assign({},x);delete y.id;b[x.id]=y});S.barrels=b;ch=true}
  const ownDirty=OWNK.some(k=>(S.own[k]||[]).length>(SY.own[k]||0));
  if(!ownDirty&&d.own){const o=emptyOwn();d.own.forEach(x=>{(o[x.key]=o[x.key]||[]).push(x.v)});
   if(canon(o)!==canon(Object.assign(emptyOwn(),S.own))){S.own=o;ch=true}SY.own={};SY.oid={};Object.keys(o).forEach(k=>{if(Array.isArray(o[k]))SY.own[k]=o[k].length})}
  if(d.khali&&canon(d.khali)!==canon(S.khali||null)){S.khali=d.khali;ch=true}
  if(d.nextJw)S.nextJw=Math.max(S.nextJw||1,d.nextJw);
  if(d.wsn)S.wsn=Math.max(S.wsn||1,d.wsn);
  SY.online=true;
  if(!SY.loaded){SY.loaded=true;ch=true;schedule()}
  if(ch){save();refresh()}
  SY.pending=pendingCount();paintSync()}
 catch(e){SY.online=false;paintSync()}}
window.millPull=pull;
function busyUI(){const a=document.activeElement;return a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)||(S.ast&&S.ast.pending)||(S.ast&&S.ast.open&&S.ast.listening)}
function refresh(){if(busyUI()){SY.needRender=true;return}
 const open=$('#layer').classList.contains('on');
 if(open){if(SY.cur){const c=SY.cur,sc=$('#layer .lb')?$('#layer .lb').scrollTop:0;try{window[c.fn].apply(null,c.args)}catch(e){}const lb=$('#layer .lb');if(lb)lb.scrollTop=sc}else{SY.needRender=true;return}}
 render()}
// remember which list sheet is open, so new data from the other phone can repaint it
['sheetWaiting','sheetJobs','sheetHeld','sheetMill','sheetParked','sheetJob','sheetRunOil'].forEach(fn=>{const f=window[fn];if(typeof f!=='function')return;window[fn]=function(){SY.next={fn,args:[].slice.call(arguments)};const r=f.apply(this,arguments);SY.next=null;return r}});
const _lay=layer;layer=function(){SY.cur=SY.next||null;const r=_lay.apply(this,arguments);schedule();return r};
const _render=render;render=function(){SY.needRender=false;const r=_render.apply(this,arguments);paintSync();schedule();return r};
const _close=closeLayer;closeLayer=function(){SY.cur=null;return _close.apply(this,arguments)};
function paintSync(){if(!LIVE)return;const h=$('#top h1 small');if(!h)return;let e=$('#syncst');if(!e){e=document.createElement('b');e.id='syncst';h.appendChild(e)}
 const n=SY.pending;e.className='syncst '+(!SY.loaded?'ld':!SY.online?'off':n?'pend':'ok');
 e.textContent=!SY.loaded?' · Loading…':!SY.online?` · Offline${n?' · '+n+' not sent':''}`:n?` · Sending ${n}…`:''}

/* ---------- real scale, from the app page ---------- */
S.link={on:false,name:'',fresh:false};
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;const d=e.data||{};
 if(d.type==='scale'){const s=S.scale,w=Math.max(0,Math.round((+d.w||0)*20)/20);S.link={on:!!d.connected,name:d.name||'',fresh:!!d.fresh};
  const v=S.link.on&&S.link.fresh?w:0;s.from=v;s.to=v;s.t0=0;paintLink()}
 if(d.type==='me'&&d.me){S.me=d.me}
 if(d.type==='toast'&&d.text)toast(d.text,d.bad?'bad':'')});
function paintLink(){const p=document.querySelector('#top .pill[data-f="bt"]');if(!p)return;const dot=p.querySelector('.dot');if(dot)dot.style.background=!LIVE||S.link.on&&S.link.fresh?'var(--okt)':S.link.on?'#E9C46A':'#E5484D';p.title=S.link.on?(S.link.name||'Scale')+(S.link.fresh?' · connected':' · no reading'):'Scale not connected · tap to connect'}
// the barrel counter desk (lots received: gross, tare, net) is its own full screen in the app
window.millCounterOpen=function(){if(window.parent!==window)window.parent.postMessage({type:'open',to:'/mill/counter'},location.origin);else location.href='/mill/counter'};
window.millScaleTap=function(){if(window.parent!==window)window.parent.postMessage({type:'scale-connect'},location.origin)};

/* ---------- the mill label printer (Helett): ONE tap — Save prints at once, the app page sends it over Bluetooth ---------- */
const PR=window.PR={native:false,name:'',ready:false,pending:0,id:'',doc:null,copies:1,busy:false,ok:null,text:'',fix:'',fallback:false,t:0};
function paintPrint(){
 const pill=document.querySelector('#top .pill[data-f="pr"]');
 if(pill){const dot=pill.querySelector('.dot');if(dot)dot.style.background=!PR.native?'#8a96a3':!PR.ready?'#E5484D':PR.pending?'#E9C46A':'var(--okt)';
  pill.title=!PR.native?'Printing uses the normal print window here (the Android app prints in one tap)':!PR.ready?'Printer not chosen · tap to pair':(PR.name||'Printer')+(PR.pending?' · '+PR.pending+' not printed':' · ready')}
 const e=document.getElementById('prst');
 if(e){const live=PR.busy||PR.ok!==null;
  e.style.display=live?'flex':'none';e.className='prst'+(PR.busy?'':PR.ok?' ok':' bad');
  e.innerHTML=(PR.busy?'<span>Printing…</span>':'<span>'+esc(PR.text)+'</span>')+(!PR.busy&&PR.ok===false&&PR.native?'<button onclick="millPrinterTap()">Printer set-up</button>':'')}
 document.querySelectorAll('.prlbl').forEach(x=>{x.textContent=PR.native&&PR.doc?'Print again':'Print'});
 let b=document.getElementById('prpend');
 if(PR.native&&PR.pending>0&&PR.ready){if(!b){b=document.createElement('div');b.id='prpend';b.className='prpend';document.body.appendChild(b)}
  b.innerHTML='<span>'+PR.pending+' slip'+(PR.pending>1?'s':'')+' not printed</span><button onclick="window.parent.postMessage({type:\'print-pending\'},location.origin)">Print now</button>'}
 else if(b)b.remove()}
function sendPrint(doc,copies){PR.id=uid('p');PR.busy=true;PR.ok=null;PR.text='';PR.fix='';
 window.parent.postMessage({type:'print',id:PR.id,doc:doc||PR.doc,copies:copies||PR.copies},location.origin);
 clearTimeout(PR.t);PR.t=setTimeout(()=>{if(PR.busy){PR.busy=false;PR.ok=false;PR.text='The printer did not answer in time. Look at the printer first: if the slip did not come out, Print again.';paintPrint()}},150000);
 setTimeout(paintPrint,0)}
window.millPrintAuto=function(doc,copies){PR.doc=doc;PR.copies=Math.max(1,+copies||1);if(!PR.native){setTimeout(paintPrint,0);return}sendPrint()};
window.printAgain=function(){if(PR.native&&PR.doc)sendPrint();else printPaper()};
// a small sticker for a bag or barrel: the code as a QR (phone camera) plus the first lines; goes to the label printer
window.millSticker=function(){const d=PR.doc;if(!d){toast('Save the slip first','bad');return}
 if(!PR.native){toast('Stickers print from the Android app','bad');return}
 const rows=(d.rows||[]).filter(r=>r!=='-').slice(0,4);
 sendPrint({kind:'sticker',code:d.code,shop:d.shop,title:d.title,when:d.when,rows,foot:d.foot,qr:true},1)};
window.millPrinterTap=function(){if(window.parent!==window)window.parent.postMessage({type:'printer-setup'},location.origin)};
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;const d=e.data||{};
 if(d.type==='printer'){PR.native=!!d.native;PR.name=d.name||'';PR.ready=!!d.ready;PR.pending=+d.pending||0;paintPrint()}
 if(d.type==='print-result'&&d.id===PR.id){clearTimeout(PR.t);PR.busy=false;PR.ok=!!d.ok;PR.text=d.text||'';PR.fix=d.fix||'';PR.fallback=!!d.fallback;paintPrint()}});
setInterval(paintPrint,2000);

/* ---------- printing: the paper on screen goes to the printer ---------- */
window.printPaper=function(){const p=document.querySelector('#layer .paper');if(!p)return;
 const n=Math.max(1,+(window.__copies||1));window.__copies=1;
 const html=Array.from({length:n},()=>p.outerHTML).join('<div class="pbrk"></div>');
 if(window.parent!==window){ // the app page prints it from a real window (printing inside this frame does nothing in the app)
  const css=Array.from(document.querySelectorAll('style')).map(x=>x.textContent).join('\n');
  window.parent.postMessage({type:'print-html',html,css},location.origin);return}
 let a=$('#printarea');if(!a){a=document.createElement('div');a.id='printarea';document.body.appendChild(a)}
 a.innerHTML=html;setTimeout(()=>window.print(),60)};

/* ---------- start ---------- */
if(LIVE){
 const d=$('#demo');if(d)d.style.display='none';
 S.jw=[];S.queue=[];S.runs=[];S.own=emptyOwn();S.barrels={};CUSTS.length=0;S.nextJw=1;S.wsn=1;S.parked=[];S.me={name:'',isOwner:false};
 try{S.parked=JSON.parse(localStorage.getItem('milldesk.parked')||'[]')}catch(e){}
 restore();
 setInterval(()=>{try{localStorage.setItem('milldesk.parked',JSON.stringify(S.parked))}catch(e){}},2000);
 setInterval(pull,4000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden){pull();push()}});
 window.addEventListener('online',()=>{push();pull()});
 document.addEventListener('focusout',()=>setTimeout(()=>{if(SY.needRender&&!busyUI())refresh()},300));
 setInterval(()=>{if(SY.needRender&&!busyUI())refresh()},1500);
 window.parent.postMessage({type:'ready'},location.origin);
 pull()}
setInterval(paintLink,1000);
})();


render();
</script>
</body>
