<style>
:root{--bg:#0B1017;--panel:#111A25;--panel2:#16212F;--line:#22304A;--ink:#EAF0F7;--soft:#8D9BAE;--gold:#D9A032;--gold2:#8A6420;--navy:#1F3057;--ok:#3F7D58;--okt:#7FCB95;--bad:#E5604A;--info:#7FA6D9;
 --head:"Baloo Tamma 2","Noto Sans Kannada",system-ui,sans-serif;--body:"Noto Sans Kannada","Baloo Tamma 2",system-ui,sans-serif;--mono:"Share Tech Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#05080C;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.35}
button{font-family:inherit;font-size:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
#app{position:relative;height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}

svg.ic{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.demo{display:flex;gap:6px;align-items:center;padding:5px 8px;background:#1b1405;border-bottom:1px solid var(--gold2);overflow-x:auto;white-space:nowrap;font-size:12px;color:#E9C46A;flex:none}

.demo button{border:1px solid var(--gold2);background:#2a1f08;border-radius:8px;padding:4px 9px;font-size:12.5px;color:#F4D58D}
.top{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);flex:none}
.jh{display:flex;align-items:center;gap:12px;margin:0 0 8px}
.jh .sn{display:block;min-width:48px;height:48px;border-radius:14px;background:#C98A25;color:#1a1204;font:800 28px/48px var(--head);text-align:center;flex:none}
.jh .snw{text-align:center;flex:none}.jh .snw small{display:block;font:600 10px var(--body);color:var(--soft);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.jh .jm{flex:1;min-width:0}.jh .dt{display:flex;align-items:center;gap:5px;font:700 15px var(--body);color:var(--gold,#E8B84A)}.jh .dt .ic{width:16px;height:16px}

.jh .inv{font:500 12px/1.25 var(--body);color:var(--soft);text-align:right;flex:none}
.top h1{margin:0;font:700 19px/1.1 var(--head);flex:1;min-width:0}

.top h1 .tt{white-space:nowrap}
.top h1 small{display:block;font:500 11.5px var(--body);color:var(--soft)}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:10px;height:36px;padding:0 10px;font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:5px}
.pill.on{background:var(--navy);border-color:#3b5392}
.dot{width:9px;height:9px;border-radius:50%;background:var(--okt);display:inline-block}
.chips{display:flex;gap:8px;padding:8px 10px;overflow-x:auto;border-bottom:1px solid var(--line);flex:none}
.cp{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:8px 12px;font:600 16px var(--head)}
.cp.has{border-color:var(--gold2);background:#251c0a}
.cp .n{min-width:26px;height:26px;border-radius:99px;background:var(--navy);display:grid;place-items:center;font:700 14px var(--head);padding:0 6px}
.cp svg.ic{width:24px;height:24px}
main{flex:1;overflow-y:auto;padding:10px 10px 90px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.wrow{display:flex;gap:8px}
.wcard{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px 14px;min-width:0}
.wcard .lbl{font:600 12px var(--body);letter-spacing:.1em;color:var(--soft);display:flex;justify-content:space-between;gap:6px}
.wnum{font:400 56px/1.05 var(--mono);text-align:right;color:var(--okt);transition:color .2s}
.wnum.mv{color:#E7C25A}.wnum.ov{color:var(--bad)}
.wstat{font:600 13px var(--body);text-align:right;min-height:19px;color:var(--soft)}
.wstat.ok{color:var(--okt)}.wstat.bad{color:var(--bad)}.wstat.gd{color:#E7C25A}
.rbtn{width:98px;flex:none;background:var(--panel2);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:600 15px/1.15 var(--body);color:var(--soft);padding:6px;text-align:center}
.own{font-size:12.5px;color:var(--soft);padding:0 4px;display:flex;flex-wrap:wrap;gap:4px 12px}
.own b{color:var(--ink);font-weight:600}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:12px}
.search{display:flex;align-items:center;gap:10px;border:2px solid #2d3b55;border-radius:16px;padding:10px 14px;background:transparent}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:500 18px var(--head)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{position:relative;border:2px solid var(--gold2);background:#101823;border-radius:18px;overflow:hidden;padding:0;display:flex;flex-direction:column;text-align:center;min-height:178px;box-shadow:0 0 14px rgba(217,160,50,.12)}

.tile.cust .no{background:#1c4a35}

.slip{display:flex;flex-direction:column;gap:12px}
.dash{border:2px dashed #3a4a66;border-radius:16px;min-height:62px;display:flex;align-items:center;justify-content:center;gap:10px;font:600 19px var(--head);background:transparent;color:var(--ink)}
.li{display:flex;flex-direction:column;gap:8px;padding:2px 2px 10px;border-bottom:1px solid var(--line)}

.tag{font:600 13px var(--body);border:1.5px solid var(--gold2);color:#E9C46A;border-radius:99px;padding:1px 10px}

.xbtn{border:0;background:none;color:var(--soft);padding:6px}
.total{background:var(--navy);border-radius:18px;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:10px}

.total b{font:800 46px/1 var(--head)}
.cake{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cake button{border:2px solid var(--line);background:var(--panel2);border-radius:14px;padding:10px 6px;text-align:center;font:600 14.5px/1.2 var(--head)}
.cake button.sel{border-color:var(--gold);background:#2a210c}
.cake button small{display:block;font:500 12px var(--body);color:var(--soft)}
.mrow{display:flex;align-items:center;gap:12px;border:2px solid var(--line);background:var(--panel2);border-radius:16px;padding:12px 14px;font:700 24px var(--head);min-height:66px}
.mrow .sp{flex:1}.mrow .amt{font:600 22px var(--mono);color:var(--soft)}
.coin{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F3D275,#B8841F);display:grid;place-items:center;color:#5a3d06;font:800 24px var(--head);box-shadow:inset 0 0 0 3px #E7BC54;flex:none}
.arr{font:800 30px/1 var(--head)}.arr.in{color:#4FCB6E}.arr.out{color:#F06C57}
.meth{display:grid;grid-template-columns:1fr 1fr;gap:8px;border-radius:20px;padding:8px}

.meth button.sel{border-color:#6F89C9;background:#17223a}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:8px}
.sbtn{border:2px solid var(--line);background:var(--panel2);border-radius:16px;min-height:78px;display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 10px;font:700 21px/1.1 var(--head);text-align:center}
.sbtn small{display:block;font:500 13px var(--body);color:var(--soft)}
.sbtn.wait{border-color:#6c5420;background:#2c2410;color:#F0CE79}
.sbtn.go{background:var(--ok);border-color:#52a173;color:#fff}
.sbtn.dis{opacity:.5}
.act{display:grid;grid-template-columns:78px 78px 1fr;gap:8px}
.act button{border-radius:16px;min-height:88px;border:2px solid var(--line);background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:600 17px var(--head)}
.act .hold{border-color:#5F82D4;background:#1a2748;color:#9DB6EE}

.act .okb span{display:flex;gap:10px;align-items:center}
.bar{position:absolute;left:0;right:0;bottom:0;background:var(--navy);display:flex;align-items:center;justify-content:space-between;padding:14px 16px calc(14px + env(safe-area-inset-bottom));font:600 19px var(--head);z-index:5;border:0;color:var(--ink);width:100%}
.bar b{font:800 28px var(--head)}
.next{position:relative;outline:3px solid var(--gold);outline-offset:3px;animation:nxGlow 1.3s ease-in-out infinite;z-index:1}
.next::after{content:"";position:absolute;top:50%;right:14px;width:34px;height:34px;transform:translateY(-10%);background:no-repeat center/contain url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M9 11V5.5a1.6 1.6 0 013.2 0V10l4 .8a2 2 0 011.6 2L17.5 19a2 2 0 01-2 1.7H11a2 2 0 01-1.6-.8L5.7 14.6a1.5 1.5 0 012.2-2L9 13.6z' fill='white' stroke='%23222' stroke-width='.9'/></svg>");animation:nxPoint .9s ease-in-out infinite;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.tile.next::after{display:none}
.sbtn.go.next{background-image:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);background-size:60% 100%;background-repeat:no-repeat;animation:nxGlow 1.3s ease-in-out infinite,nxSheen 2.2s linear infinite}
@keyframes nxGlow{0%,100%{outline-color:rgba(217,160,50,.45)}50%{outline-color:#FFC857}}
@keyframes nxPoint{0%,100%{transform:translate(0,-10%)}50%{transform:translate(-6px,2%)}}
@keyframes nxSheen{0%{background-position:-120% 0}100%{background-position:220% 0}}
@media(prefers-reduced-motion:reduce){.next,.next::after{animation:none}}
.layer{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;background:var(--bg)}
.layer.on{display:flex}
.lh{display:flex;align-items:center;gap:10px;padding:14px 14px 8px;flex:none}
.lh h2{flex:1;margin:0;font:700 25px/1.1 var(--head)}
.lb{flex:1;overflow-y:auto;padding:0 12px 30px;display:flex;flex-direction:column;gap:12px}
.note{font-size:15px;color:#C7D1DF;line-height:1.45}
.card{border:2px solid var(--line);background:var(--panel);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px}

.pillrow{display:flex;gap:8px;flex-wrap:wrap}
.pc{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 14px;font:700 19px var(--head)}
.pc.ok{border-color:#4a9a6b;color:var(--okt)}.pc.gd{border-color:var(--gold2);color:#E9C46A}
.st{border:2px solid var(--gold2);border-radius:99px;display:flex;align-items:center;gap:10px;padding:5px 14px;font:600 20px var(--head);color:#E9A94A}
.st.ok{border-color:#4a9a6b;color:var(--okt)}
.inp{width:100%;border:2px solid #2d3b55;background:transparent;border-radius:14px;padding:11px 14px;color:var(--ink);font:600 19px var(--head);outline:0}
.chrow{display:flex;gap:8px;flex-wrap:wrap}
.ch{border:2px solid var(--line);background:var(--panel2);border-radius:14px;padding:10px 14px;font:600 17px var(--head)}
.ch.sel{border-color:var(--gold);background:#2a210c}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{min-height:62px;border:2px solid var(--line);background:var(--panel2);border-radius:14px;font:700 26px var(--head)}
.toast{position:absolute;left:12px;right:12px;bottom:84px;z-index:40;background:#0d2a1a;border:2px solid #4a9a6b;color:#bdf0cf;border-radius:16px;padding:12px 14px;font:600 17px var(--head);display:none;gap:10px;align-items:center}
.toast.on{display:flex}.toast.bad{background:#3a1710;border-color:#E5604A;color:#ffd0c7}
.paper{background:#fff;color:#111;border-radius:6px;padding:14px 16px;font:13px/1.35 ui-monospace,Menlo,monospace;box-shadow:0 2px 12px rgba(0,0,0,.4)}
.paper .hd{text-align:center;font-weight:800;font-size:16px;letter-spacing:.06em}
.paper .hr{border-top:1px dashed #777;margin:7px 0}

.qrw{width:104px;margin:8px auto 0}.bcw{margin-top:8px;height:42px}
.wk .tile{min-height:150px}

.wk .tile .bdw{display:flex;justify-content:center;padding:10px 4px;font:800 28px var(--head)}

.badge svg.ic{width:17px;height:17px;stroke-width:2.3}
.wdone{border:2px solid #4a9a6b;background:#0d2a1a;border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center}
.wdone b{font:800 36px var(--mono);color:var(--okt)}
.takeoff{background:#2c2410;border:2px solid var(--gold);border-radius:14px;padding:10px;text-align:center;font:700 20px var(--head);color:#FFD27A;animation:nxGlow 1.2s ease-in-out infinite}
.grp{display:flex;align-items:center;gap:8px;font:700 17px var(--head);padding:2px 2px 0}

.tile .no{font:800 20px/1 var(--head);padding:7px 0 5px}
.tile{min-height:148px}.tile.d-in .no{background:#173a28}.tile.d-out .no{background:#43201a}.tile.d-none .no{background:#222c3c}

.st3{width:62px;height:76px;border-radius:14px;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);border:2px solid var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}.st3 svg.ic{width:28px;height:28px}
.wk .tile{min-height:132px}.wk .tile .no{font-size:18px}
.wk .tile .no{min-height:0;display:block;padding:7px 0 5px;font-size:20px}.wk .tile .art{flex:1;align-items:center;padding:6px 0 10px}.wk .ia{width:72px;height:72px}.wk .ia svg.ic{width:40px;height:40px}.wk .ia .bdg svg.ic{width:17px;height:17px}.wk .pb svg.ic{width:36px;height:36px}.wk .st3{width:70px;height:88px}.wk .st3 svg.ic{width:34px;height:34px}

 if(!ready())return;const raw=S.scale.w,can=(k==='ooil'||k==='coil');const kg=r2(can?raw-S.canTare:raw);
 if(kg<=0)return toast('Weight is below the empty can','bad');
 if(k==='bfull'||k==='bempty'||k==='bout'){if(S.mode==='worker'){trayAdd(k,r2(raw));return}sheetBarrel(k,r2(raw));return}
 if(S.mode==='worker'){trayAdd(k,kg);return}

 if(k==='coil'){sheetJobPick('Customer oil '+f1(kg)+' kg — whose?',j=>{j.oilKg=kg;toast(j.customer+' · oil '+f1(kg)+' kg weighed');afterSave();sheetHeld()},j=>j.crushed&&!j.given);return}
 if(k==='ckhali'){sheetJobPick('Customer khali '+f1(kg)+' kg — whose?',j=>giveKhali(j,kg),j=>j.crushed&&j.khaliKg==null);return}
 if(k==='ooil'){sheetTank(kg);return}
 const key=k;(S.own[key]=S.own[key]||[]).push(kg);toast(IT[k].wl+' '+f1(kg)+' kg saved');afterSave()}

  return `<div class="card">${whead(gi+1,g.items[0].time)}<h3>${art(i)}${esc(S.lang==='kn'?i.kn:i.wl)}${g.cno?`<span class="bagchip" style="margin-left:auto">${cnoL()} ${g.cno}</span>`:''}</h3>
   <div class="wtot"><b>${f1(kg)} kg</b><small>${isBagK(g.k)?bagTxt(sum(g.items.map(x=>x.nb||1)))+' · ':''}${g.items.length} weighing(s)</small></div>
   ${g.items.map(x=>`<div class="wl1"><span>${x.time}</span><span>${esc(x.by)}</span>${isBagK(x.k)?`<span>${bagTxt(x.nb||1)}</span>`:''}${x.slip?`<span>${x.slip}</span>`:''}${x.voice?`<button class="vp" onclick="toast('Playing voice note · ${x.voice} s')">${ic('mic')}${x.voice}s</button>`:''}${x.photo?`<button class="vp" onclick="toast('Photo of the bags opens here')">${ic('camera')}photo</button>`:''}<b>${f2(x.kg)}</b></div>`).join('')}
   ${bagBtns}<div class="two" style="grid-template-columns:1fr 1fr">${acts}</div></div>`}).join('');
 layer('Waiting list'+(S.queue.length?` · ${S.queue.length}`:''),(S.queue.length?`<div class="note">What the workers weighed. Sort each group. The weights cannot be changed, but a load can be moved to another bag no.</div>${sumBar}${filt}${cards}`:`<div class="note" style="text-align:center;padding:30px 0">${ic('check')}<br>Nothing waiting. Workers' weighings appear here.</div>`))}
const takeG=gi=>{const g=groups()[gi];S.queue=S.queue.filter(x=>!g.items.includes(x));return g};
function wNewJob(gi){const g=takeG(gi);S.slip.cnos=(S.slip.cnos||[]);slipNbs();while(S.slip.cnos.length<S.slip.lines.length)S.slip.cnos.push('');S.slip.cnos=S.slip.cnos.concat(g.items.map(x=>x.cno||''));slipNbs();S.slip.nbs=S.slip.nbs.slice(0,S.slip.lines.length).concat(g.items.map(x=>x.nb||1));S.slip.lines=S.slip.lines.concat(g.items.map(x=>x.kg));S.view='slip';S.mode='counter';closeLayer();toast('Loaded into a new job — choose the customer')}
function wToJob(gi){const g=groups()[gi];sheetJobPick('Add '+f1(sum(g.items.map(x=>x.kg)))+' kg to which job?',j=>{const gg=takeG(groupsIdx(g));j.nb=bagsOf(j)+sum(gg.items.map(x=>x.nb||1));j.lines=j.lines.concat(gg.items.map(x=>x.kg));j.seedKg=r2(sum(j.lines));toast('Added to '+j.tok);sheetWaiting()},j=>!j.crushed)}
function groupsIdx(g){return groups().findIndex(x=>x.k===g.k&&x.cno===g.cno)}
function wOil(gi,tank){const g=takeG(gi);g.items.forEach(x=>S.own.ooil.push([x.kg,tank]));toast(f1(sum(g.items.map(x=>x.kg)))+' kg → '+tank);sheetWaiting()}
function wOwn(gi,key){const g=takeG(gi);g.items.forEach(x=>(S.own[key]=S.own[key]||[]).push(x.kg));toast('Saved');sheetWaiting()}
function wKhali(gi){const g=groups()[gi],kg=sum(g.items.map(x=>x.kg));sheetJobPick('Customer khali '+f1(kg)+' kg — whose?',j=>{const gg=takeG(groupsIdx(g));giveKhali(j,sum(gg.items.map(x=>x.kg)))},j=>j.crushed&&j.khaliKg==null)}

/* ---------- what the customer has taken, job card, jobs list ---------- */
function takenChips(j,compact){const p=[];
 if(j.advC)p.push(`<span class="pc tk"><span class="coin sm">₹</span>Advance ${inr(j.advC)}</span>`);
 if(j.advA)p.push(`<span class="pc tk">${ic('auto')}Tempo ${inr(j.advA)}</span>`);
 CANK.forEach(([k,ico,n])=>{const q=(j.cans||{})[k];if(q)p.push(`<span class="pc tk">${icoSvg(ico,22)}${n} × ${q}</span>`)});
 return p.length?`<div class="pillrow">${p.join('')}</div>`:(compact?'':'<div class="note">Nothing taken yet · no advance, no cans.</div>')}
function nextAct(j){if(j.settled&&j.given)return '';
 if(!j.crushed)return `<button class="sbtn go next" style="min-height:64px" onclick="const J=S.jw.find(x=>x.tok==='${j.tok}');J.crushed=true;J.tCrushed=clock();toast('Crushing done · now in Held');sheetJobs()">${ic('crush')}${ic('check')}Crushing done</button>`;
 return `<button class="sbtn go next" style="min-height:64px" onclick="sheetHeld()">${ic(!j.settled?'rupee':'oilout')}${ic('arrowr')}${!j.settled?(j.cake==='SHOP'?'Pay customer':'Khali payment'):'Oil out'}</button>`}
function ownIcon(sz){return `<span class="jci own" style="--s:${sz||26}px">${ic('crush')}<i>${ic('mill')}</i></span>`}
function jcIcon(sz){return `<span class="jci" style="--s:${sz||26}px">${ic('crush')}<i>${ic('user')}</i></span>`}
function jobSteps(j){const dirIn=j.cake!=='SHOP';const st=[['weigh','Weighed',true],['crush','Crushed',j.crushed],['rupee',dirIn?'Khali payment':'Pay customer',j.settled],['oilout','Oil out',j.given]];
 const cur=st.findIndex(x=>!x[2]);
 return `<div class="steps">${st.map((x,i)=>`<div class="stp ${x[2]?'ok':i===cur?'cur':''}"><span>${ic(x[0])}${x[2]?`<i class="tk">${ic('check')}</i>`:''}</span><small>${x[1]}</small></div>`).join('<i class="sep"></i>')}</div>`}
function canStep(tok,k,d){const j=S.jw.find(x=>x.tok===tok);j.cans[k]=Math.max(0,(j.cans[k]||0)+d);sheetJob(tok)}
function setAdv(tok,f,v){S.jw.find(x=>x.tok===tok)[f]=v;sheetJob(tok)}
function sheetJob(tok){const j=S.jw.find(x=>x.tok===tok),s=settlement(j),dirIn=s.dir==='in',edit=!j.settled;
 const row=(ico,label,val,fn)=>`<button class="trow" ${fn&&edit?`onclick="${fn}"`:'disabled'} style="opacity:1"><span class="ti">${ico}</span><span class="tl">${label}</span><span class="tv">${val}</span>${fn&&edit?ic('edit'):''}</button>`;
 const canRows=CANK.map(([k,ico,n])=>{const q=(j.cans||{})[k]||0;return `<div class="trow"><span class="ti">${icoSvg(ico,36)}</span><span class="tl">${n}<small>${inr(CANS[k])} each</small></span>${edit?`<button class="stp1" onclick="canStep('${tok}','${k}',-1)">−</button>`:''}<b class="q">${q}</b>${edit?`<button class="stp1" onclick="canStep('${tok}','${k}',1)">+</button>`:''}<span class="tv">${q?inr(q*CANS[k]):'—'}</span></div>`}).join('');
 const acct=`<div class="acct"><div class="ar"><span>Seed · ${bagTxt(bagsOf(j))}</span><b>${f1(j.seedKg)} kg</b></div><div class="ar"><span>${dirIn?'Customer takes khali · ₹10/kg':'Shop keeps khali · ₹6/kg'}</span><b>${inr(s.gross)}</b></div>${j.advC?`<div class="ar"><span>− customer advance</span><b>${inr(j.advC)}</b></div>`:''}${j.advA?`<div class="ar"><span>− tempo advance</span><b>${inr(j.advA)}</b></div>`:''}${s.cans?`<div class="ar"><span>${dirIn?'+ cans taken':'− cans taken'}</span><b>${inr(s.cans)}</b></div>`:''}
  ${dirIn?`<div class="ar res"><span>${ic('down')} Khali payment</span><b>${inr(s.cust)}</b></div>`:`<div class="ar res"><span>${ic('up')} Pay customer</span><b>${inr(s.cust)}</b></div><div class="ar res"><span>${ic('auto')} Pay tempo</span><b>${inr(s.auto)}</b></div>`}</div>`;
 const khali=j.khaliKg!=null?`${f1(j.khaliKg)} kg handed`:(dirIn?'not weighed yet':'shop keeps');
 layer(`${esc(j.customer)}<small style="display:block;font:500 14px var(--body);color:var(--soft)">${j.tok.replace('JW-','#')} · ${esc(j.place)} · ${j.time}</small>`,
  `${jobSteps(j)}${payStatus(j)}
  <div class="sec"><div class="grp"><span class="gi" style="background:#C98A25">${ic('rupee')}</span>Taken by customer${edit?'':' · locked after payment'}</div>
   ${row(`<span class="coin sm">₹</span>`,'Customer advance',j.advC?inr(j.advC):'₹ —',`sheetNum('Customer advance (₹)',v=>setAdv('${tok}','advC',v),'sheetJob(\'${tok}\')')`)}
   ${row(ic('auto'),'Tempo advance',j.advA?inr(j.advA):'₹ —',`sheetNum('Tempo advance (₹)',v=>setAdv('${tok}','advA',v),'sheetJob(\'${tok}\')')`)}
   ${canRows}</div>
  <div class="sec"><div class="grp"><span class="gi" style="background:#C98A25">${ic('swap')}</span>Who keeps khali (oil cake)${edit?'':' · locked after payment'}</div>
   <div class="cake"><button class="${j.cake==='SHOP'?'sel':''}" ${edit?`onclick="setCake('${tok}','SHOP')"`:'disabled'}>${icoSvg('khali',34)}${ic('shop')}<br>Shop keeps<small>₹6/kg</small></button><button class="${j.cake!=='SHOP'?'sel':''}" ${edit?`onclick="setCake('${tok}','CUSTOMER')"`:'disabled'}>${icoSvg('khali',34)}${ic('user')}<br>Customer takes<small>₹10/kg</small></button></div>
   ${edit?'<div class="note">Customer changed their mind? Tap the other one. The money below updates.</div>':''}</div>
  <div class="sec"><div class="grp"><span class="gi" style="background:#3F9D63">${ic('list')}</span>Status</div>
   ${row(icoSvg('khali',32),'Khali · Oil cake',khali)}${row(ic('oilout'),'Oil',j.given?(j.oilKg!=null?f1(j.oilKg)+' kg out':'out'):j.oilKg!=null?f1(j.oilKg)+' kg · here':'not weighed')}</div>
  <div class="sec"><div class="grp"><span class="gi" style="background:#8A7F6E">${ic('clock')}</span>Date &amp; time</div>${[['Weighed',j.time],['Crushed',j.tCrushed||(j.crushed?'—':null)],[dirIn?'Khali payment':'Pay customer',j.tPaid||(j.settled?'—':null)],['Oil out',j.tGiven||(j.given?'—':null)],...(j.cakeLog||[]).map(x=>['Khali changed',x])].map(r=>`<div class="ar"><span>${r[0]}</span><b>${r[1]||'not yet'}</b></div>`).join('')}</div>
  <div class="sec"><div class="grp"><span class="gi" style="background:#5F82D4">${ic('book')}</span>Account</div>${acct}</div>
  ${!j.crushed?`<button class="sbtn go next" onclick="const J=S.jw.find(x=>x.tok==='${tok}');J.crushed=true;J.tCrushed=clock();toast('Crushing done · now in Held');sheetJob('${tok}')">${ic('crush')}${ic('check')}Crushing done</button>`:!(j.settled&&j.given)?`<button class="sbtn go next" onclick="sheetHeld()">${ic('lock')}Go to Held · money and oil</button>`:`<div class="st ok">${ic('check')} Closed</div>`}`,'sheetJobs()')}
function sheetJobs(){const js=S.jw.slice().sort(sortJ);
 const card=j=>`<div class="card ${j.settled&&j.given?'done':''}">${jhead(j,true)}${jobSteps(j)}${payStatus(j)}<div class="pillrow"><span class="pc">${f1(j.seedKg)} kg</span><span class="pc">${bagTxt(bagsOf(j))}</span><span class="pc gd">${j.cake==='SHOP'?'khali: shop':'khali: customer'}</span></div>${takenChips(j,true)}${nextAct(j)}<button class="sbtn" style="min-height:58px" onclick="sheetJob('${j.tok}')">${jcIcon()}Job card${!j.settled?' · '+ic('swap')+' Khali':''}</button></div>`;
 const sec=(t,ico,col,l)=>l.length?`<div class="grp"><span class="gi" style="background:${col}">${ic(ico)}</span>${t} (${l.length})</div>`+l.map(card).join(''):'';
 layer('Jobs today',sec('To crush','crush','#C98A25',js.filter(j=>!j.crushed))+sec('Crushed · money or oil pending','lock','#5F82D4',js.filter(j=>j.crushed&&!(j.settled&&j.given)))+sec('Closed','check','#3F9D63',js.filter(j=>j.settled&&j.given)))}

/* ---------- Held queue: money first, then oil (same guided order as the counter) ---------- */
function sheetHeld(){const hs=held();
 layer(`${ic('lock')} Held (${hs.length})`,`<div class="note">Crushed jobs. Tap the glowing step. For customer-pays jobs the oil stays here until the money is received.</div>`+(hs.length?hs.map(j=>{const s=settlement(j),dirIn=s.dir==='in',amt=inr(Math.abs(s.due)),lock=dirIn&&!j.settled;
  const money=j.settled?`<div class="st ok">${ic('check')} ${dirIn?'Khali payment':'Pay customer'} – ${amt} ✓</div>`:`<div class="st"><span class="arr ${dirIn?'in':'out'}" style="font-size:24px">${dirIn?'↓':'↑'}</span>${dirIn?'Khali payment':'Pay customer'} – ${amt} ${ic('hourg')}</div>`;
  const nextMoney=!j.settled,nextOil=j.settled&&!j.given;
  return `<div class="card ${j.settled&&j.given?'done':''}">${jhead(j,true)}
   <div class="pillrow"><span class="pc">Seed ${f1(j.seedKg)} kg · ${bagTxt(bagsOf(j))}</span>${j.khaliKg!=null?`<span class="pc gd">Khali out ${f1(j.khaliKg)} kg</span>`:''}</div>${takenChips(j,true)}
   ${payStatus(j)}${money}
   <button class="sbtn" style="min-height:52px" onclick="sheetJob('${j.tok}')">${jcIcon()}Job card</button>
   ${!dirIn&&!j.settled?`<div class="note">Customer ${inr(s.cust)} · Tempo ${inr(s.auto)} · after advance${s.cans?' and cans':''}</div>`:''}
   ${!j.settled?`<div class="meth" style="padding:0">${['cash','upi'].map(m=>`<button class="${j.method===m?'sel':''}" onclick="S.jw.find(x=>x.tok==='${j.tok}').method='${m}';sheetHeld()">${m==='cash'?'<span class="coin" style="width:34px;height:34px;font-size:17px">₹</span>':ic('book')}${t(m)}</button>`).join('')}</div>`:''}
   ${!j.settled?`<button class="mrow ${nextMoney?'next':''}" style="border-color:#fff;background:#0f1722" onclick="settle('${j.tok}')"><span class="coin">₹</span><span class="arr ${dirIn?'in':'out'}">${dirIn?'↓':'↑'}</span><span class="sp">${dirIn?'Khali payment':'Pay customer'} – ${amt}</span></button>`:''}
   ${!j.given?`<button class="sbtn ${lock?'dis':nextOil?'go':''} ${nextOil?'next':''}" style="min-height:76px" onclick="${lock?"toast('Wait for the khali payment first','bad')":`giveOil('${j.tok}')`}">${ic('oilout')}<span>Oil out ${j.oilKg!=null?'· '+f1(j.oilKg)+' kg':'(not weighed)'} → ${ic('user')}</span></button>`:`<div class="st ok">${ic('check')} Oil out${j.oilKg!=null?' · '+f1(j.oilKg)+' kg':''}</div>`}
   ${lock&&!j.given?`<div class="note" style="text-align:center">${ic('hand')} Oil out · wait for khali payment</div>`:''}
   <div class="note">${j.settled&&j.given?'Closed.':''}</div></div>`}).join(''):'<div class="note">Nothing held. All crushed jobs are settled.</div>'))}
function settle(tok){const j=S.jw.find(x=>x.tok===tok);j.settled=true;j.tPaid=clock();toast((settlement(j).dir==='in'?'Cash in ':'Cash out ')+inr(Math.abs(settlement(j).due))+' · '+j.method.toUpperCase());sheetHeld()}
function payStatus(j){const st=settlement(j),dirIn=st.dir==='in';
 const one=(ico,who,adv,final,paid)=>paid?`<div class="ps ok">${ic('check')}${ic(ico)}<b>${who}</b><span>Paid${final?' '+inr(final):''}${adv?' · adv '+inr(adv):''}</span></div>`
  :adv?`<div class="ps ok">${ic('check')}${ic(ico)}<b>${who}</b><span>Advance taken ${inr(adv)}</span></div>`
  :`<div class="ps no">${ic('clock')}${ic(ico)}<b>${who}</b><span>No advance</span></div>`;
 return `<div class="pstat">${one('user','Customer',j.advC,dirIn?0:st.cust,j.settled)}${one('auto','Tempo',j.advA,st.auto,j.settled&&!dirIn)}</div>`}
function setCake(tok,c){const j=S.jw.find(x=>x.tok===tok);if(j.settled||j.cake===c)return;j.cake=c;(j.cakeLog=j.cakeLog||[]).push(clock()+' → '+(c==='SHOP'?'Shop keeps':'Customer takes'));if(c==='SHOP')delete j.khaliKg;toast('Khali: '+(c==='SHOP'?'shop keeps · ₹6/kg':'customer takes · ₹10/kg'));sheetJob(tok)}
function giveOil(tok){const j=S.jw.find(x=>x.tok===tok);j.given=true;j.tGiven=clock();toast('Oil out · '+j.customer);sheetHeld()}

render();
</script>
</body>
